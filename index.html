    <h1>Coming soon</h1>
    <form name="waitlist" id="waitlist">
      <p class="hp"><label>Leave empty <input name="company"></label></p>
      <input type="email" name="email" placeholder="Your email" required aria-label="Email address">
      <button type="submit">Notify me</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <span class="tag">/STICK THROUGH IT ALL/</span>
  </div>
</div>
<button class="sound" id="snd" type="button" aria-pressed="false">Sound off</button>
<script>
  const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxhTaXVS1MVEQcTLNeYxokAJucj6C6iQenMjRiwTEqehgd6xSvN9SyTxvfObrK7fO5g/exec';
  const f = document.getElementById('waitlist'), m = document.getElementById('msg');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    if (f.company.value) return;
    const btn = f.querySelector('button'); btn.disabled = true;
    try {
      await fetch(SHEET_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({ email:f.email.value }) });
      f.reset(); m.textContent = "You're on the list.";
    } catch { m.textContent = 'Something went wrong. Try again.'; }
    btn.disabled = false;
  });
  const v = document.getElementById('vid'), b = document.getElementById('snd');
  b.addEventListener('click', () => {
    v.muted = !v.muted;
    if (!v.muted) v.play().catch(() => {});
    b.textContent = v.muted ? 'Sound off' : 'Sound on';
    b.setAttribute('aria-pressed', String(!v.muted));
  });
</script>
